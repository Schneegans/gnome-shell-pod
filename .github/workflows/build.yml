name: Build and Deploy Containers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to GitHub Container Registry"
        required: true
        type: boolean
        default: false
      tag:
        description: "Tag for the images to build"
        required: true
        type: string

jobs:
  build:
    name: Build & Test Fedora ${{ matrix.fedora_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false # don't fail the whole build if one version fails so we know if this is gnome change issue or our issue
      matrix:
        fedora_version: ["41", "42", "43", "44"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.push_images) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.fedora_version }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=gnome-shell-pod-${{ matrix.fedora_version }}
            org.opencontainers.image.description=Headless Wayland GNOME Shell container for extension testing (Fedora ${{ matrix.fedora_version }})
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build local test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: fedora_version=${{ matrix.fedora_version }}
          load: true
          tags: local/gnome-shell-pod:${{ matrix.fedora_version }}

      - name: Run verification test suite
        env:
          CONTAINER_RUNTIME: docker
        run: |
          ./scripts/test.sh local/gnome-shell-pod:${{ matrix.fedora_version }}

      - name: Push container image
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.push_images) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: fedora_version=${{ matrix.fedora_version }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          provenance: false # removes unknown/unknown from the packages pages
          push: true
