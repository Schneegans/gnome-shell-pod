name: Deploy Rawhide Container

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push image to GHCR"
        required: true
        type: boolean
        default: true
      tag:
        description: "Tag for the images to build"
        required: true
        type: string

jobs:
  build:
    name: Build & Deploy Rawhide Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.push_images) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-rawhide
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=gnome-shell-pod-rawhide
            org.opencontainers.image.description=Headless Wayland GNOME Shell container for extension testing (Fedora Rawhide)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build local test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: fedora_version=rawhide
          load: true
          tags: local/gnome-shell-pod:rawhide

      - name: Run verification test suite
        env:
          CONTAINER_RUNTIME: docker
        run: |
          ./scripts/test.sh local/gnome-shell-pod:rawhide

      - name: Push container image
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.push_images) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: fedora_version=rawhide
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          provenance: false
          push: true
